name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No API keys in the browser bundle
        run: |
          if grep -rEl "sk-ant-|ANTHROPIC_API_KEY|ACCESS_CODES" dist; then
            echo "A secret or its name ended up in dist/. Keep it on the server."; exit 1
          fi
